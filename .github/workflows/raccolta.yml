name: Raccolta e aggiornamento
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: raccolta-treni
  cancel-in-progress: false
jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Raccolta dati
        run: python scripts/raccolta.py
      - name: Aggregazione
        run: python scripts/aggrega.py
      - name: Salva le novità nel repository
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "Nessuna novità da salvare"
          else
            git commit -m "Aggiornamento dati $(TZ=Europe/Rome date '+%d/%m/%Y %H:%M')"
            git pull --rebase
            git push
          fi
