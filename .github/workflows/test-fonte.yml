name: Test fonte ViaggiaTreno
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Esegui il test
        run: python scripts/test_fonte.py
      - name: Salva i risultati nel repository
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add test_output
          git commit -m "Risultati test fonte" || echo "niente da salvare"
          git push
